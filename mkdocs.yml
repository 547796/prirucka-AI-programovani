site_name: AI ve výuce programování
site_description: Metodická příručka pro učitele programování
site_author: Michal Černý
docs_dir: docs
site_dir: site

theme:
  name: material
  language: cs
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Tmavý režim
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Světlý režim
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: cs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - abbr
  - md_in_html
  - tables
  - footnotes

extra_css:
  - assets/extra.css

nav:
  - Úvod: index.md
  - "1 · Generativní AI ve výuce programování": kapitola-01/index.md
  - "2 · Pedagogické promptování": kapitola-02/index.md
  - "3 · AI jako tutor": kapitola-03/index.md
  - "4 · Debugování kódu pomocí AI": kapitola-04/index.md
  - "5 · AI párové programování": kapitola-05/index.md
  - "6 · AI jako nástroj pro přípravu učitele": kapitola-06/index.md
  - "7 · Praktické aktivity": kapitola-07/index.md
  - "8 · Hodnocení studentů": kapitola-08/index.md
  - "9 · Závěr": kapitola-09/index.md
  - "10 · Zdroje": kapitola-10/index.md
